services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      PUBLIC_SITE_ORIGIN: https://${SITE_DOMAIN:-thuart68.cn}
    volumes:
      - yi68_data:/app/data
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  https:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-thuart68.cn}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  yi68_data:
  caddy_data:
  caddy_config:
